<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>成绩查询</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1d2330; --muted: #6b7280;
    --line: #e5e7eb; --accent: #2457d6; --accent-soft: #eaf0fd; --err: #c0362c;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14161b; --card: #1d2027; --text: #e8eaf0; --muted: #9aa1ad;
      --line: #2e323b; --accent: #7ea2ff; --accent-soft: #232c45; --err: #ff7b70; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 40px 16px 64px; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; font-size: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 22px; }
  label { display: block; font-size: 14px; color: var(--muted); margin: 0 0 6px; }
  input { width: 100%; font: inherit; padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--bg); color: var(--text); margin-bottom: 16px; }
  input:focus { outline: 2px solid var(--accent); border-color: transparent; }
  button { width: 100%; font: inherit; font-weight: 600; padding: 12px; border: 0; border-radius: 10px;
    background: var(--accent); color: #fff; cursor: pointer; }
  button:disabled { opacity: .6; cursor: wait; }
  .msg { margin: 14px 0 0; font-size: 14px; min-height: 1.6em; }
  .msg.err { color: var(--err); }
  #result { margin-top: 20px; }
  .head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 14px; }
  .head .who { font-size: 18px; font-weight: 600; }
  .total { background: var(--accent-soft); border-radius: 12px; padding: 16px; text-align: center; margin-bottom: 16px; }
  .total .k { font-size: 13px; color: var(--muted); }
  .total .v { font-size: 40px; font-weight: 700; color: var(--accent); line-height: 1.2; }
  .total .v small { font-size: 16px; color: var(--muted); font-weight: 400; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
  .cell { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
  .cell .k { font-size: 12px; color: var(--muted); }
  .cell .v { font-size: 18px; font-weight: 600; }
  .cell .v small { font-size: 12px; color: var(--muted); font-weight: 400; }
  .cell.lost .v { color: var(--err); }
  .tag { display: inline-block; font-size: 12px; font-weight: 600; line-height: 1; padding: 3px 6px; border-radius: 6px;
    background: var(--accent-soft); color: var(--accent); vertical-align: 3px; }
  .x { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 14px; overflow-x: auto; }
  .tab { width: auto; flex: none; background: var(--bg); color: var(--muted); border: 1px solid var(--line);
    font-weight: 500; font-size: 14px; padding: 7px 12px; border-radius: 999px; }
  .tab.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .tname { font-size: 14px; color: var(--muted); margin: -6px 0 12px; }
  .group { display: flex; justify-content: space-between; align-items: baseline; margin: 18px 0 8px;
    padding-bottom: 6px; border-bottom: 1px solid var(--line); font-weight: 600; }
  .group b { font-size: 17px; }
  .group b small { color: var(--muted); font-weight: 400; font-size: 12px; }
  .group.lost b { color: var(--err); }
  .foot { color: var(--muted); font-size: 12px; margin-top: 24px; text-align: center; }
  .link { background: none; color: var(--accent); width: auto; padding: 0; font-weight: 400; font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1 id="title">成绩查询</h1>
  <p class="sub">输入本人姓名和身份证号，只能查看自己的成绩。</p>

  <form class="card" id="form" autocomplete="off">
    <label for="name">姓名</label>
    <input id="name" required maxlength="20" placeholder="例如：张三">
    <label for="id">身份证号</label>
    <input id="id" required maxlength="20" inputmode="text" placeholder="18 位，末位 X 不区分大小写">
    <button id="btn" type="submit">查询</button>
    <p class="msg" id="msg"></p>
  </form>

  <section id="result" hidden></section>

  <p class="foot">查询在你自己的设备上完成，姓名和身份证号不会上传。</p>
</main>

<script src="lib.js"></script>
<script>
(async function () {
  const $ = (s) => document.querySelector(s);
  const msg = (t, err) => { $('#msg').textContent = t; $('#msg').className = 'msg' + (err ? ' err' : ''); };
  let data;
  try {
    data = await (await fetch('data.json', { cache: 'no-store' })).json();
    if (data.title) { $('#title').textContent = data.title; document.title = data.title; }
    if (data.keyLabel && data.keyLabel !== '身份证号') {
      $('label[for=id]').textContent = data.keyLabel;
      $('#id').placeholder = '老师发给你的 6 位' + data.keyLabel + '，不区分大小写';
      $('.sub').textContent = '输入本人姓名和' + data.keyLabel + '，只能查看自己的成绩。';
      $('.foot').textContent = '查询在你自己的设备上完成，姓名和' + data.keyLabel + '不会上传。';
    }
  } catch (e) {
    msg('成绩数据加载失败，请稍后刷新重试。', true);
    $('#btn').disabled = true;
    return;
  }

  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  // 大字显示的总分：优先「总分/五总/六总…」这类最大的总分
  const isTotal = (k) => /总分|合计|总计|总成绩|^[五六七九]总$|全科/.test(k);

  function tableHtml(t) {
    let totalHtml = '', cells = '';
    t.items.forEach((it) => {
      const { k, v, full: f, tag, extra } = it;
      const tagHtml = tag ? ` <span class="tag">${esc(tag)}</span>` : '';
      const extraHtml = extra ? `<div class="x">${extra.map(esc).join('<br>')}</div>` : '';
      if (isTotal(k) && !totalHtml) {
        totalHtml = `<div class="total"><div class="k">${esc(k)}</div><div class="v">${esc(v)}${f ? ` <small>/ ${esc(f)}</small>` : ''}${tagHtml}</div>${extraHtml}</div>`;
        return;
      }
      const lost = f && v !== '' && !isNaN(v) && Number(v) < Number(f);
      const score = `${esc(v === '' ? '—' : v)}${f ? ` <small>/${esc(f)}</small>` : ''}`;
      if (it.group) { // 大题作为分组标题，下面跟它的小题
        cells += `${cells ? '</div>' : ''}<div class="group${lost ? ' lost' : ''}"><span>${esc(k)}</span><b>${score}</b></div><div class="grid">`;
        return;
      }
      if (!cells) cells = '<div class="grid">';
      cells += `<div class="cell${lost ? ' lost' : ''}"><div class="k">${esc(k)}</div><div class="v">${score}${tagHtml}</div>${extraHtml}</div>`;
    });
    if (cells) cells += '</div>';
    return totalHtml + cells;
  }

  function render(r) {
    const tabs = r.tables.length > 1
      ? `<div class="tabs">${r.tables.map((t, i) => `<button type="button" class="tab${i ? '' : ' on'}" data-i="${i}">${esc(t.title)}</button>`).join('')}</div>`
      : `<div class="tname">${esc(r.tables[0].title || '')}</div>`;
    $('#result').innerHTML = `<div class="card">
      <div class="head"><span class="who">${esc(r.name)}</span><button class="link" id="again" type="button">换个人查</button></div>
      ${tabs}<div id="tbody">${tableHtml(r.tables[0])}</div></div>`;
    document.querySelectorAll('.tab').forEach((b) => (b.onclick = () => {
      document.querySelectorAll('.tab').forEach((x) => x.classList.toggle('on', x === b));
      $('#tbody').innerHTML = tableHtml(r.tables[Number(b.dataset.i)]);
    }));
    $('#result').hidden = false;
    $('#form').hidden = true;
    $('#again').onclick = () => {
      $('#result').hidden = true; $('#result').innerHTML = '';
      $('#form').hidden = false; $('#form').reset(); msg(''); $('#name').focus();
    };
  }

  $('#form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = ScoreLib.normName($('#name').value);
    const id = ScoreLib.normId($('#id').value);
    if (!name) return msg('请输入姓名。', true);
    const label = data.keyLabel || '身份证号';
    if (label === '身份证号' ? !ScoreLib.checkId(id) : !id) return msg(label === '身份证号' ? '身份证号格式不对，请核对 18 位号码。' : '请输入' + label + '。', true);
    $('#btn').disabled = true;
    msg('正在查询…');
    try {
      const r = await ScoreLib.lookup(data, name, id);
      if (!r) msg('没有查到。请确认姓名和' + label + '输入正确。', true);
      else { msg(''); render(r); }
    } catch (err) {
      msg('查询出错，请刷新后重试。', true);
    } finally {
      $('#btn').disabled = false;
    }
  });
})();
</script>
</body>
</html>
