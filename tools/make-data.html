<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>生成加密成绩数据</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1d2330; --muted:#6b7280; --line:#e5e7eb; --accent:#2457d6; --err:#c0362c; --ok:#1f7a4d; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif; }
  main { max-width: 820px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px; margin-bottom:16px; }
  h2 { font-size: 16px; margin: 0 0 10px; }
  label { font-size: 14px; color: var(--muted); }
  input[type=text], textarea { width:100%; font:inherit; padding:9px 10px; border:1px solid var(--line); border-radius:8px; }
  textarea { height: 180px; font-family: ui-monospace, Menlo, monospace; font-size: 13px; }
  button { font:inherit; font-weight:600; padding:10px 18px; border:0; border-radius:8px; background:var(--accent); color:#fff; cursor:pointer; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .cols { display:flex; flex-wrap:wrap; gap:6px 14px; }
  .cols label { color: var(--text); }
  .err { color: var(--err); } .ok { color: var(--ok); }
  ul { margin: 6px 0 0; padding-left: 20px; }
  progress { width: 100%; }
  code { background:#eef0f3; padding:1px 5px; border-radius:4px; }
</style>
</head>
<body>
<main>
  <h1>生成加密成绩数据（老师本地用）</h1>
  <p class="sub">全程在本机浏览器里完成，不联网上传。生成的 <code>data.json</code> 里没有任何明文姓名、身份证号或分数。</p>

  <div class="card">
    <h2>1. 考试名称（显示在查询页标题）</h2>
    <input type="text" id="title" placeholder="例如：高一5班 期中考试 数学小分查询">
  </div>

  <div class="card">
    <h2>2. 粘贴成绩表</h2>
    <p class="sub" style="margin:0 0 8px">在 Excel / WPS 里选中整张表（含表头）复制，粘贴到下面。也可以选一个 CSV 文件。<br>
      表头必须有 <code>姓名</code> 和 <code>身份证号</code> 两列；可选加一行姓名写 <code>满分</code>、身份证号空着，查询页会显示每题满分。</p>
    <textarea id="raw" placeholder="姓名	身份证号	1	2	3	…	总分"></textarea>
    <p><input type="file" id="file" accept=".csv,.txt,.tsv"></p>
    <button id="parse">读取表格</button>
    <div id="parseOut"></div>
  </div>

  <div class="card" id="step3" hidden>
    <h2>3. 选择要给学生看的列</h2>
    <div class="cols" id="cols"></div>
    <p class="sub" style="margin:10px 0 0">身份证号永远不会写进数据。排名类的列默认不勾选。</p>
  </div>

  <div class="card" id="step4" hidden>
    <h2>4. 生成</h2>
    <button id="build">生成 data.json</button>
    <p><progress id="prog" value="0" max="1" hidden></progress></p>
    <div id="buildOut"></div>
  </div>
</main>

<script src="../lib.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let table = null;

function parseText(text) {
  text = text.replace(/^﻿/, '').replace(/\r\n?/g, '\n').trim();
  const first = text.split('\n')[0];
  const delim = first.includes('\t') ? '\t' : ',';
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i+1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"' && cell === '') q = true;
    else if (c === delim) { row.push(cell.trim()); cell = ''; }
    else if (c === '\n') { row.push(cell.trim()); rows.push(row); row = []; cell = ''; }
    else cell += c;
  }
  row.push(cell.trim()); rows.push(row);
  return rows.filter((r) => r.some((x) => x !== ''));
}

$('#file').onchange = async (e) => {
  const f = e.target.files[0]; if (!f) return;
  const buf = await f.arrayBuffer();
  let text = new TextDecoder('utf-8').decode(buf);
  if (text.includes('�')) text = new TextDecoder('gbk').decode(buf); // Excel 导出的 CSV 常是 GBK
  $('#raw').value = text;
};

$('#parse').onclick = () => {
  const rows = parseText($('#raw').value);
  const out = $('#parseOut');
  if (rows.length < 2) { out.innerHTML = '<p class="err">没读到数据，请确认粘贴了表头和至少一行学生。</p>'; return; }
  const head = rows[0];
  const iName = head.findIndex((h) => /姓名/.test(h));
  let iId = head.findIndex((h) => /身份证/.test(h));
  let keyLabel = '身份证号', genCodes = false;
  if (iId < 0) { iId = head.findIndex((h) => /查询码/.test(h)); keyLabel = '查询码'; }
  if (iId < 0) { genCodes = true; } // 两列都没有：自动给每人生成查询码
  if (iName < 0) { out.innerHTML = '<p class="err">表头里找不到「姓名」列。</p>'; return; }

  let full = null; const students = []; const problems = []; const seen = new Set();
  rows.slice(1).forEach((r, n) => {
    const name = ScoreLib.normName(r[iName]);
    const id = genCodes ? ScoreLib.newCode() : ScoreLib.normId(r[iId]);
    if (name === '满分') { full = r; return; }
    if (!name) { problems.push(`第 ${n + 2} 行：姓名为空`); return; }
    if (keyLabel === '身份证号' && !genCodes && !ScoreLib.checkId(id)) { problems.push(`第 ${n + 2} 行 ${esc(name)}：身份证号「${esc(r[iId])}」校验不通过（Excel 可能把末几位变成了 0 或科学计数法）`); return; }
    if (!id) { problems.push(`第 ${n + 2} 行 ${esc(name)}：查询码为空`); return; }
    if (seen.has(name + id)) { problems.push(`第 ${n + 2} 行 ${esc(name)}：重复`); return; }
    seen.add(name + id);
    students.push({ name, id, row: r });
  });
  table = { head, iName, iId, full, students, keyLabel, genCodes };

  out.innerHTML = `<p class="ok">读到 ${students.length} 名学生${full ? '，含满分行' : ''}。` +
    (genCodes ? '表里没有身份证号或查询码列，将自动给每人生成 6 位查询码，生成时会一起下载名单。' : `用「${keyLabel}」作为查询凭证。`) + '</p>' +
    (problems.length ? `<p class="err">以下 ${problems.length} 行被跳过，请改好再粘贴：</p><ul class="err">${problems.map((p) => `<li>${p}</li>`).join('')}</ul>` : '');

  $('#cols').innerHTML = head.map((h, i) => {
    if (i === iName || i === iId) return '';
    const on = !/排名|名次|排序|学号|身份证/.test(h);
    return `<label><input type="checkbox" data-i="${i}" ${on ? 'checked' : ''}> ${esc(h || '(空表头)')}</label>`;
  }).join('');
  $('#step3').hidden = false; $('#step4').hidden = students.length === 0; $('#buildOut').innerHTML = '';
};

$('#build').onclick = async () => {
  const idx = [...document.querySelectorAll('#cols input:checked')].map((x) => Number(x.dataset.i));
  const cols = idx.map((i) => table.head[i]);
  const full = {};
  if (table.full) idx.forEach((i) => { if (table.full[i]) full[table.head[i]] = table.full[i]; });
  const salt = ScoreLib.newSalt();
  const records = {};
  const prog = $('#prog'); prog.hidden = false; prog.max = table.students.length; prog.value = 0;
  $('#build').disabled = true;
  $('#buildOut').innerHTML = '<p>正在加密，每人约半秒，请不要关闭页面…</p>';

  const list = table.students.slice();
  const workers = Array.from({ length: 6 }, async () => {
    while (list.length) {
      const s = list.shift();
      const payload = { name: s.name, cols, vals: idx.map((i) => s.row[i] ?? ''), full };
      const [k, v] = await ScoreLib.encryptRecord(s.name, s.id, payload, salt);
      records[k] = v;
      prog.value++;
    }
  });
  await Promise.all(workers);

  // 打乱顺序，避免从文件顺序推断学号/名单顺序
  const shuffled = Object.fromEntries(Object.entries(records).sort(() => Math.random() - 0.5));
  const data = { title: $('#title').value.trim() || '成绩查询', keyLabel: table.keyLabel, salt, iterations: ScoreLib.ITERATIONS, records: shuffled };
  const save = (content, name, type) => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([content], { type })); a.download = name; a.click(); };
  save(JSON.stringify(data), 'data.json', 'application/json');
  if (table.genCodes) {
    const csv = '﻿姓名,查询码\r\n' + table.students.map((s) => `${s.name},${s.id}`).join('\r\n');
    setTimeout(() => save(csv, '查询码名单（只给老师，不要上传）.csv', 'text/csv'), 500);
  }
  $('#build').disabled = false;
  $('#buildOut').innerHTML = `<p class="ok">已生成 ${table.students.length} 条加密记录，data.json 已下载。把它替换掉仓库根目录里的 data.json 即可。</p>
    <p class="sub">建议先用一两个学生的真实信息在查询页里试查一下。</p>`;
};
</script>
</body>
</html>
